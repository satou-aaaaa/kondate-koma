:root{

html{height:100%}body{min-height:100%}

.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}

.note a,.about a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.5rem;text-align:center;margin:0;line-height:1.35}
.title{font-weight:900;font-size:2.1rem;letter-spacing:.14em;text-align:center;margin:6px 0 0;color:var(--ai2);flex:none}
.title span{color:var(--shu)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.fsrow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink2)}
.fsrow button{all:unset;box-sizing:border-box;cursor:pointer;min-width:52px;min-height:48px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:900;color:var(--ink)}
.fsrow button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 方眼の手帳 */
/* 選び肢 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:5.2rem;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--paper);border:3px solid var(--ai);box-shadow:0 5px 0 #24427a55;font-weight:900;font-size:1.9rem;color:var(--ink);padding:.4rem}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #24427a55}
.ch small{font-size:.55em;margin-left:2px}
.ch.ng{opacity:.5;border-color:var(--shu);border-style:dashed;cursor:default;box-shadow:none;animation:shake .4s}
.ch.ng::after{content:"✕ ちがう";position:absolute;top:4px;right:8px;font-size:.8rem;font-weight:900;color:var(--shu2)}
.ch.ok{border-color:var(--ok);background:#eef7f0;box-shadow:0 5px 0 #25734a66}
.ch.ok::after{content:"✓ 正解";position:absolute;top:4px;right:8px;font-size:.8rem;font-weight:900;color:var(--ok2)}
.ch:disabled{cursor:default}

@keyframes pop{40%{transform:scale(1.15)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:1rem;margin:0}

.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #1f2a4420;animation:up .35s ease-out}

.verdict .why b{color:var(--ok2)}

.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu)}.dots i.done{background:var(--ai)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}

.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-size:.95rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
/* 帳 */
.book{display:flex;flex-direction:column;gap:8px}
.book button,.book .no{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:10px;min-height:56px;border-radius:12px;padding:6px 12px;background:var(--paper);border:2px solid var(--line);font-size:.95rem}
.book .no{cursor:default;color:var(--ink2);border-style:dashed}
.book .mk{font-size:1.2rem;text-align:center}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}
.ach.got{background:#eef3fb;border-color:var(--ai)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#eef3fb}.cal .c.p2{background:#d5e1f3}.cal .c.p3{background:var(--ai);color:#fff;border-color:var(--ai2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dashed var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}

.komabox{display:flex;justify-content:center}
.koma{width:min(100%,300px);height:auto;display:block;overflow:visible}
.koma .band{stroke:#1f2a44;stroke-width:1.4}
.koma .cell{stroke:#1f2a44;stroke-width:1.1}
.koma .cell.e{fill:#fff;stroke-dasharray:3 2}
.koma text{font-family:var(--f-body);fill:#1f2a44;font-weight:900}
.koma .lab{font-size:11px}.koma .cnt{font-size:11px}
.koma .low{fill:#86291a}
.koma.spin .body{animation:spin 1.6s ease-in-out}
.koma.tip .body{animation:tip .6s ease-in-out}

.menu{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.35rem;box-shadow:0 4px 12px #1f2a4418}

.meal>b.snack{background:var(--ink2)}
.dishes{display:flex;flex-wrap:wrap;gap:.3rem}
.dish{display:inline-flex;align-items:center;gap:.25rem;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.1rem .45rem;font-size:.82rem;line-height:1.35;font-weight:700}
.dish .em{font-size:1.05rem}

.chip.gx{border-color:#6b6f7a;background:#eee;border-style:dashed}
.ask{margin:0;text-align:center;font-weight:900;font-size:1.05rem}
.ch{flex-direction:column;gap:.15rem;font-size:.95rem;line-height:1.3;min-height:5.6rem;text-align:center;padding:.55rem .4rem .45rem}
.ch .em{font-size:1.9rem;line-height:1.1}
.ch .chip{margin-top:.1rem}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.fgrid>div.no{border-style:dashed;color:var(--ink2)}
.fgrid .em{font-size:1.3rem}
.fgrid b{display:block;font-size:.85rem}
.gsum{font-size:.85rem;color:var(--ink2);margin:0}
/* 色の見分けを助ける：区分の印に模様（点線・二重線）も足す */
html.a11y-cvd .chip{border-width:3px}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタンでも枠が消えないよう、いちばん最後に強く書く */
:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];

  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };

    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));

  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");

  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));

    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  window.A11y = { on, set, open, say, stop };
})();
</script>

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/kondate-koma/";
const FEEDBACK = "https://github.com/satou-aaaaa/kondate-koma/issues/new?template=feedback.yml";
const SRC = "https://www.maff.go.jp/j/syokuiku/kenzensyokuseikatsu/about_b_guide.html";
const KEY = "kondate-v1", FSKEY = "kondate-fs", EPOCH = "2026-11-07";
const G = window.KONDATE, LV = G.LV, GR = G.GROUPS, D = G.DBY;

// ---- 文字の大きさ（この端末だけ。記録とは別に置く）----
function fsGet() { try { const v = +localStorage.getItem(FSKEY); return v >= 1 && v <= 3 ? v : 1; } catch (e) { return 1; } }

document.documentElement.classList.remove("fs1", "fs2", "fs3"); document.documentElement.classList.add("fs" + fsGet());

// ---- 日付（日本時間。だれでも同じ5問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const listOf = (mode, date) => (mode === "h" ? G.hardTags(date) : G.dailyTags(date));

// 今日のまめ知識：食事バランスガイド（農林水産省のページ）に書かれていることを、日ごとに1つ
const TIPS = [
  ["いもは副菜", "じゃがいも・さつまいもの料理は、主食ではなく副菜のなかまです。"],
  ["大豆は主菜", "とうふ・納豆など大豆の料理は主菜。ほかの豆（煮豆）は副菜です。"],
  ["お菓子はこまのひも", "お菓子や甘い飲み物は、どのなかまにも入りません。1日200kcalくらいまで。"],
  ["水・お茶はこまの軸", "水やお茶は、こまの真ん中の軸です。食事といっしょにしっかりとりましょう。"],
  ["主食1つは炭水化物40g", "ごはん小盛り1杯・おにぎり1個・食パン1枚が、主食1つです。"],
  ["副菜1つは約70g", "野菜サラダや具たくさん味噌汁1杯で、副菜1つです。"],
  ["果物1つは約100g", "みかん1個・りんご半分が果物1つ。すいか・いちごも果物です。"],
];
const tipOf = (k) => TIPS[((dayNo(k) - 1) % TIPS.length + TIPS.length) % TIPS.length];

// ---- とことん：やさしい5 → ふつう10 → むずかしい85 を、毎回ちがう種で。使い切ったら次の100問を足す（乱数は練習ととことんだけ）----
const ERAMP = [[0, 5], [1, 10], [2, 85]];
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function randomTags(lv, n, salt) {
  const ids = G.kindsOf(lv), out = []; let prev = null;
  for (let i = 0; i < n; i++) { let id; do { id = ids[Math.floor(Math.random() * ids.length)]; } while (ids.length > 1 && id === prev); prev = id; out.push(`${id}|${salt}:${i}`); }
  return out;
}
function endlessList() { const s = rid(), out = []; for (const [lv, n] of ERAMP) out.push(...randomTags(lv, n, s + ":" + lv)); return out; }
const moreList = () => randomTags(2, 100, rid() + ":m");
const starsOf = (m) => (m === 0 ? 3 : m === 1 ? 2 : 1); // m = まちがい＋ヒントの数
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// days/hdays/adays：日付 → { m:[1問ごとのまちがい＋ヒント], k:[種類] }。adays はあとから遊んだ日（連続の日・今日の記録・Ko-fi には数えない）
// dex：種類 → 解いた数。food：料理 → 足して正解した数（料理帳）。runs：モードごとの途中経過（練習で今日・上級の途中を消さない）
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, food: {}, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0 });
const BOXES = ["days", "hdays", "adays", "dex", "food", "runs", "kofi", "ach"];
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.mode !== "e" && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m), k: r.list.slice(0, r.res.length).map((t) => t.split("|")[0]) });
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);
// 終わった回を日ごとの記録に入れる（結果を見る前に閉じても、別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }
// 保存に失敗したあとはメモリと保存の両方を読む。合わせる前に両方を fresh() で補う。数は高いほう、途中経過は同じ回なら進んだほう
function load() {
  let a = null, b = null;
  try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {}
  if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null;
  if (!a || !b) { const s = Object.assign(fresh(), a || b || {}); return tidy(s); }
  a = tidy(Object.assign(fresh(), a)); b = tidy(Object.assign(fresh(), b));
  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);
  for (const k in o) {
    if (k === "runs" || k === "t") continue;
    const x = o[k], y = n[k];
    if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); }
    else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y);
    else if (x === true) s[k] = true;
  }
  const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);
  s.runs = Object.assign({}, n.runs);
  for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
    const x = ra[m], y = rb[m];
    if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; }
    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (!bd || !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id && x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }
    else if (x.id === y.id) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; }
  }
  return tidy(s);
}
// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない）
const num = (v) => (Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0);
function tidy(s) {
  s.ebest = num(s.ebest);
  for (const q of BOXES) if (!s[q] || typeof s[q] !== "object" || Array.isArray(s[q])) s[q] = {};
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  for (const k in s.dex) if (!own(G.BY, k)) delete s.dex[k]; else s.dex[k] = num(s.dex[k]);
  for (const k in s.food) if (!own(D, k)) delete s.food[k]; else s.food[k] = num(s.food[k]);
  // 日付と日ごとの記録の形も確かめ、壊れたものは捨てる（細工した引き継ぎコードで画面が止まらないように）
  const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; };
  const okTag = (t) => typeof t === "string" && Object.prototype.hasOwnProperty.call(G.BY, t.split("|")[0]);
  const okRec = (x) => !!x && typeof x === "object" && Array.isArray(x.m) && x.m.every((v) => Number.isInteger(v) && v >= 0);
  for (const b of [s.days, s.hdays, s.adays]) for (const d in b) if (!okDate(d) || !okRec(b[d])) delete b[d];
  for (const m in s.runs) {
    const r = s.runs[m]; if (r === null) continue;
    if (typeof r !== "object" || !["d", "h", "a", "p", "e"].includes(r.mode) || !okDate(r.date) || !Array.isArray(r.list) || !r.list.every(okTag) || !Array.isArray(r.res) || !r.res.every((x) => x && typeof x === "object" && Number.isInteger(x.m) && x.m >= 0)) { delete s.runs[m]; continue; }
    if (r.cur != null && (typeof r.cur !== "object" || !Array.isArray(r.cur.wrong) || !r.cur.wrong.every((w) => typeof w === "string"))) r.cur = null; else if (r.cur) r.cur.hints = num(r.cur.hints);
    for (const q of ["clean", "miss"]) if (q in r) r[q] = num(r[q]);
  }
  return s;

function startRun(mode, opt) {

    if (mode === "a") {
      const ra = s.runs[runKey("a", opt)];

      if (ra && ra.date === opt && !doneOf(ra)) return;

    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない

  });

  MODE = runKey(mode, opt);
  play();
}

// ヒント2：まちがいの選び肢を消して、2つまでにしぼる（消す順は選び肢の並びの順）
const cutOf = () => { if (cur.hints < 2) return []; const left = cur.P.opts.filter((t) => t !== cur.P.ans && !cur.wrong.includes(t)); return left.slice(0, Math.max(0, left.length - 1)); };
function paint() {

  document.querySelectorAll(".ch").forEach((b) => { const t = P.opts[+b.dataset.j], d = D[t], ng = cur.wrong.includes(t) || cut.includes(t); b.classList.toggle("ng", ng); b.disabled = ng || cur.done; b.querySelector(".cg").innerHTML = cur.wrong.includes(t) || cur.done ? chip(d) : ""; if (ng) b.setAttribute("aria-label", d.n + "（ちがう）"); });

function hint() { if (cur.done || cur.hints >= 2) return; if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); } cur.hints++; keep(); paint(); }

    const d = D[t], after = G.totalsWith(P, t), over = d.g >= 0 && d.g !== P.X ? !G.inRange(d.g, after[d.g]) : false;
    $("msg").className = "msg bad";

  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on("calm") ? "auto" : "smooth", block: "nearest" }); }, 60);

function finish() {

function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }

// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
